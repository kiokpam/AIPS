<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'Dashboard' }}</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fb; min-height: 100vh; color: #333; }
    .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { background: #0f172a; color: #e2e8f0; padding: 16px; }
    .brand { font-weight: 800; letter-spacing: .3px; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; display:flex; align-items:center; gap:10px; }
    .nav { display: grid; gap: 6px; margin-top: 10px; }
    .nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #e2e8f0; text-decoration: none; border-radius: 8px; }
    .nav a:hover { background: rgba(255,255,255,0.08); }
    .nav a.active { background: #1e293b; }
    .content { padding: 20px; overflow: auto; background: linear-gradient(135deg, #eef2ff 0%, #f5f7fb 100%); }
    .page-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 14px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><i class="fas fa-video"></i> Vision Dashboard</div>
      <nav class="nav">
        <a href="/cameras" class="{% if active=='cameras' %}active{% endif %}"><i class="fas fa-camera"></i> Quản lý camera</a>
        <a href="/stats" class="{% if active=='stats' %}active{% endif %}"><i class="fas fa-chart-line"></i> Thống kê</a>
        <a href="/settings" class="{% if active=='settings' %}active{% endif %}"><i class="fas fa-gear"></i> Cấu hình</a>
      </nav>
    </aside>
    <main class="content">
      <div class="page-title">{% block title %}{% endblock %}</div>
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
