[project]
name = "aips-backend"
version = "0.1.0"
description = "AIPS FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "SQLAlchemy>=2.0.32",
    "psycopg[binary]>=3.2.1",
    "httpx>=0.25.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "werkzeug>=2.3.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
    "bcrypt>=4.0.1,<5.0.0",
]

# Optional dependencies for AI/GPU features
[project.optional-dependencies]
ai = [
    "torch>=2.0.0",
    "pynvml>=11.5.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


