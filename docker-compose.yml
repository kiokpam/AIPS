services:
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: aips-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aips
      - POSTGRES_PASSWORD=aips
      - POSTGRES_DB=aips
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aips"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: aips-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    environment:
      - TZ=Asia/Bangkok
      - DATABASE_URL=postgresql+psycopg://aips:aips@db:5432/aips
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=dev-secret-change-me
      - JWT_EXPIRES_SECONDS=2592000  # 30 days = 1 month
      - FRONTEND_URL=http://localhost:3000
      # Email configuration - Gmail SMTP
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@aips.local}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-AIPS}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - CLIPS_DIR=/app/clips
    ports:
      - "8000:8000"
    volumes:
      - ./clips:/app/clips  # Shared with AI service for anomaly clips
    # Webcam device access (Linux only - may not work on Windows/WSL)
    # Uncomment the devices section below to enable webcam access in Docker
    # On Linux: devices: ["/dev/video0", "/dev/video1"]
    # On Windows/WSL: Webcam access from Docker is limited. Consider running backend outside Docker.
    # devices:
    #   - /dev/video0
    #   - /dev/video1
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: aips-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_NOTIFICATION_URL=http://notification:8004
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # Notification Service - Handles WebSocket, Email, Telegram notifications
  notification:
    build: ./notification-service
    container_name: aips-notification
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - BACKEND_URL=http://backend:8000
      - FRONTEND_URL=http://localhost:3000
      # Email configuration
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@aips.local}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-AIPS}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # Telegram configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_MAX_RETRIES=${TELEGRAM_MAX_RETRIES:-3}
      - TELEGRAM_RETRY_DELAY=${TELEGRAM_RETRY_DELAY:-5}
    ports:
      - "8004:8004"
    depends_on:
      - backend
    volumes:
      - ./clips:/app/clips  # Access to video clips for Telegram

  # AI Service - GPU Accelerated
  # Requires: NVIDIA GPU + nvidia-docker runtime
  ai:
    build: ./ai
    container_name: aips-ai
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - BACKEND_URL=http://backend:8000
      - AI_DEVICE=cuda  # GPU acceleration enabled
      - CLIPS_DIR=/app/clips  # Directory for saving video clips
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      - backend
    volumes:
      - ./ai:/app
      - ./clips:/app/clips  # Saved video clips for anomalies
    # GPU Support - requires nvidia-docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  db_data:
