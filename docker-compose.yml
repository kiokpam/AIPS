services:
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: aips-db
    restart: unless-stopped
    environment:
      # DEV-ONLY credentials for a local database. Change them (and the backend's
      # DATABASE_URL) before running anywhere other than your own machine.
      - POSTGRES_USER=aips
      - POSTGRES_PASSWORD=aips
      - POSTGRES_DB=aips
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aips" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: aips-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
      - NEXT_PUBLIC_BACKEND_URL=http://host.docker.internal:8000
      - NEXT_PUBLIC_NOTIFICATION_URL=http://notification:8004
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # Notification Service - Handles WebSocket, Email, Telegram notifications
  notification:
    build: ./notification-service
    container_name: aips-notification
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - BACKEND_URL=http://host.docker.internal:8000
      - FRONTEND_URL=http://localhost:3000
      # Email configuration
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@aips.local}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-AIPS}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # Telegram configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_MAX_RETRIES=${TELEGRAM_MAX_RETRIES:-3}
      - TELEGRAM_RETRY_DELAY=${TELEGRAM_RETRY_DELAY:-5}
    ports:
      - "8004:8004"
    volumes:
      - ./clips:/app/clips # Access to video clips for Telegram

  # AI Service - GPU Accelerated
  # Requires: NVIDIA GPU + nvidia-docker runtime
  ai:
    build: ./ai
    container_name: aips-ai
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - BACKEND_URL=http://host.docker.internal:8000
      - AI_DEVICE=cuda # GPU acceleration enabled
      - CLIPS_DIR=/app/clips # Directory for saving video clips
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      # Performance: Disable per-frame DB writes for real-time bounding boxes
      - ENABLE_DETECTION_DB_PERSIST=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ai:/app
      - ./clips:/app/clips # Saved video clips for anomalies
    # GPU Support - requires nvidia-docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  db_data:
