services:
  db:
    image: timescale/timescaledb-ha:pg15-latest
    environment:
      - POSTGRES_USER=aips
      - POSTGRES_PASSWORD=aips
      - POSTGRES_DB=aips
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aips"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    environment:
      - DATABASE_URL=postgresql+psycopg://aips:aips@db:5432/aips
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=dev-secret-change-me
      - JWT_EXPIRES_SECONDS=3600
      - FRONTEND_URL=http://localhost:3000
      # Email configuration - Gmail SMTP
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@aips.local}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-AIPS}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next


volumes:
  db_data:


